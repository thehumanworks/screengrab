# Release builds for GitHub Releases.
#
# Pushing a v* tag (or dispatching with a tag input) builds release binaries
# and attaches them as tarball assets, which makes the tool runnable straight
# from GitHub with tools that consume release assets, e.g.:
#
#   mise x github:thehumanworks/screengrab -- screengrab --help
#
# Asset names carry the os/arch tokens (darwin|linux, arm64|x86_64) that
# mise/ubi-style asset pickers match on, and each tarball contains the
# `screengrab` binary at its root.
#
# Pull requests run the same build matrix without publishing, so the darwin
# CGo paths are compile-verified before merge. The darwin jobs must run on a
# macOS 26 image: the Wails v3 Liquid Glass and ScreenCaptureKit code paths
# compile against the macOS 26 SDK (see the Makefile's
# MACOSX_DEPLOYMENT_TARGET note).

name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  # Dispatch mode creates the tag server-side (useful where local `git push`
  # of tags is unavailable) and then runs the same build + release pipeline.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create at the dispatched ref and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  tag:
    name: create dispatched tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ inputs.tag }}`;
            if (!/^v\d/.test(tag)) throw new Error(`tag must look like vX...: ${tag}`);
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`created ${tag} at ${context.sha}`);
            } catch (e) {
              if (e.status !== 422) throw e;
              // Tag exists (e.g. from a failed earlier dispatch): move it to
              // the dispatched commit so the release matches what was built.
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
                sha: context.sha,
                force: true,
              });
              core.info(`moved existing ${tag} to ${context.sha}`);
            }

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    needs: tag
    if: always() && needs.tag.result != 'failure' && needs.tag.result != 'cancelled'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            goarch: arm64
            runner: macos-26
          - os: darwin
            arch: x86_64
            goarch: amd64
            runner: macos-26
          - os: linux
            arch: x86_64
            goarch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Wails Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build release binary
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: make build-release

      - name: Package tarball
        if: github.event_name != 'pull_request'
        run: |
          ASSET="screengrab-${RELEASE_TAG}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$ASSET" screengrab
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        run: sha256sum screengrab-*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: assets/*
          generate_release_notes: true
